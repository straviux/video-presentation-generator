[package]
name = "video-presentation-generator"
version = "1.0.0"
description = "Desktop launcher for the Video Presentation Generator"
authors = ["Arc"]
edition = "2021"

[lib]
name = "video_presentation_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
